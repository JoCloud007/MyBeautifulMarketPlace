services:
  db:
    image: postgres:16-alpine
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - cloudmarket-net
  api:
    image: cloudmarket-api
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      args:
        REPO_URL: ${REPO_URL:-}
        IMAGE: ${API_IMAGE:-node}
        TAG: ${API_TAG:-20-bookworm}
        HTTP_PROXY: ${COMPOSE_HTTP_PROXY:-}
        HTTPS_PROXY: ${COMPOSE_HTTPS_PROXY:-}
        NO_PROXY: ${COMPOSE_NO_PROXY:-}
        NODE_TLS_REJECT_UNAUTHORIZED: ${COMPOSE_NODE_TLS_REJECT_UNAUTHORIZED:-1}
    env_file:
      - .env
    environment:
      NODE_ENV: development
      DATABASE_URL: ${DATABASE_URL}
      PORT: ${PORT}
      HTTP_PROXY: ${COMPOSE_HTTP_PROXY:-}
      HTTPS_PROXY: ${COMPOSE_HTTPS_PROXY:-}
      NO_PROXY: ${COMPOSE_NO_PROXY:-}
      NODE_TLS_REJECT_UNAUTHORIZED: ${COMPOSE_NODE_TLS_REJECT_UNAUTHORIZED:-1}
    ports:
      - "3001:3001"
    command: ["npx", "tsx", "src/index.ts"]
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3001/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./apps/api:/app/apps/api
      - ./packages:/app/packages
    networks:
      - cloudmarket-net

  web:
    image: cloudmarket-web
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        REPO_URL: ${REPO_URL:-}
        IMAGE: ${WEB_IMAGE:-node}
        TAG: ${WEB_TAG:-20-alpine}
        HTTP_PROXY: ${COMPOSE_HTTP_PROXY:-}
        HTTPS_PROXY: ${COMPOSE_HTTPS_PROXY:-}
        NO_PROXY: ${COMPOSE_NO_PROXY:-}
        NODE_TLS_REJECT_UNAUTHORIZED: ${COMPOSE_NODE_TLS_REJECT_UNAUTHORIZED:-1}
    env_file:
      - .env
    environment:
      API_HOST: api
      API_PORT: 3001
      PORT: 5192
      VITE_API_URL: ${VITE_API_URL}
      HTTP_PROXY: ${COMPOSE_HTTP_PROXY:-}
      HTTPS_PROXY: ${COMPOSE_HTTPS_PROXY:-}
      NO_PROXY: ${COMPOSE_NO_PROXY:-}
      NODE_TLS_REJECT_UNAUTHORIZED: ${COMPOSE_NODE_TLS_REJECT_UNAUTHORIZED:-1}
    ports:
      - "5192:5192"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - cloudmarket-net

volumes:
  postgres_data:

networks:
  cloudmarket-net:
    driver: bridge
